      args: { SERVICE_PATH: services/notification }
    ports: ["127.0.0.1:8113:8080"]

  approval:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { SERVICE_PATH: services/approval }
