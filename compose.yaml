x-service-defaults: &service-defaults
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/ready')"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 5s

services:
  vehicle-master:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { SERVICE_PATH: services/vehicle-master }
    ports: ["8101:8080"]

  telematics-unit-master:
    <<: *service-defaults
