  signal-correlation:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { SERVICE_PATH: services/signal-correlation }
    ports: ["127.0.0.1:8116:8080"]

  # Operations console (Streamlit). It has no login and acts as the reviewers listed below,
  # so it must stay bound to 127.0.0.1.
  console:
    build:
      context: .
      dockerfile: Dockerfile.console
    restart: unless-stopped
    environment:
      FLEETOPS_CONSOLE_REVIEWERS: ${FLEETOPS_CONSOLE_REVIEWERS:-reviewer_ops_001,reviewer_safety_001}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    ports: ["127.0.0.1:8501:8501"]

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./gateway/html:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    ports: ["127.0.0.1:8080:8080"]

volumes:
  pgdata:

