# Services reach PostgreSQL through the Compose service name `db`.
# Override FLEETOPS_DB_HOST / FLEETOPS_DB_PORT / FLEETOPS_DB_PASSWORD to use another server.

# docker compose up -d OR docker compose -f compose.yaml up -d
# docker compose ps
# docker ps --filter "name=fleet-ops-db"
# docker logs fleet-ops-db

x-service-defaults: &service-defaults
  restart: unless-stopped
  environment:
    FLEETOPS_DB_HOST: ${FLEETOPS_DB_HOST:-db}
    FLEETOPS_DB_PORT: ${FLEETOPS_DB_PORT:-5432}
    FLEETOPS_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    db-bootstrap:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/ready')"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 5s

services:
  db:
    image: postgres:18
    container_name: fleet-ops-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: fleetops
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ keeps data under /var/lib/postgresql/<major>/docker; mount the parent.
      - pgdata:/var/lib/postgresql
      # Creates the per-service databases the first time the volume is initialized.
      - ./database/docker-init:/docker-entrypoint-initdb.d:ro
      - ./database/bootstrap:/fleetops-bootstrap:ro
    healthcheck:
      # TCP, not the socket: the temporary server used during first-time init
      # does not listen on TCP, so the services wait until init has finished.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Creates any missing service databases and roles, then exits. The init script in
  # database/docker-init only runs on an empty volume; this also covers services added later.
  db-bootstrap:
    image: postgres:18
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ./database/bootstrap:/fleetops-bootstrap:ro
    entrypoint: ["sh", "-c"]
    command:
      - >-
        psql -h db -U postgres -d postgres -v ON_ERROR_STOP=1
        -v password="$$PGPASSWORD" -f /fleetops-bootstrap/create_service_databases.sql
    depends_on:
      db:
        condition: service_healthy

  vehicle-master:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { SERVICE_PATH: services/vehicle-master }
    ports: ["127.0.0.1:8101:8080"]

  telematics-unit-master:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { SERVICE_PATH: services/telematics-unit-master }
    ports: ["127.0.0.1:8102:8080"]

  fleet-master:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { SERVICE_PATH: services/fleet-master }
    ports: ["127.0.0.1:8103:8080"]

  maintenance-history:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { SERVICE_PATH: services/maintenance-history }
    ports: ["127.0.0.1:8104:8080"]

  service-provider-master:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { SERVICE_PATH: services/service-provider-master }
    ports: ["127.0.0.1:8105:8080"]

  vehicle-context-facade:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { SERVICE_PATH: services/vehicle-context-facade }
    ports: ["127.0.0.1:8106:8080"]

  telematics-event:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { SERVICE_PATH: services/telematics-event }
    ports: ["127.0.0.1:8107:8080"]

  digital-twin-context:
