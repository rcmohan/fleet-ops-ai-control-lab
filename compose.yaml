x-service-defaults: &service-defaults
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/ready')"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 5s

services:
  master-data-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fleetops
      POSTGRES_PASSWORD: fleetops_synthetic
      POSTGRES_DB: postgres
    ports: ["5432:5432"]
    volumes:
      - master-data-postgres:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetops -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  tenant-master:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { SERVICE_PATH: services/tenant-master }
    environment:
      DATABASE_URL: postgresql://fleetops:fleetops_synthetic@master-data-postgres:5432/fleetops_tenant_master
    depends_on:
      master-data-postgres: { condition: service_healthy }
    ports: ["8100:8080"]

  vehicle-master:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { SERVICE_PATH: services/vehicle-master }
    environment:
      DATABASE_URL: postgresql://fleetops:fleetops_synthetic@master-data-postgres:5432/fleetops_vehicle_master
      TENANT_MASTER_URL: http://tenant-master:8080
    depends_on:
      master-data-postgres: { condition: service_healthy }
      tenant-master: { condition: service_healthy }
    ports: ["8101:8080"]

  telematics-unit-master:
