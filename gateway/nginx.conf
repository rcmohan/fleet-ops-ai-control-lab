# Local gateway: http://127.0.0.1:8080/<service>/... -> http://<service>:8080/<service>/...
# The path is forwarded unchanged; X-Forwarded-Prefix lets each FastAPI app serve /docs under it.
# http://127.0.0.1:8080/fleet/ is the fleet console (Streamlit, which needs WebSockets).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    absolute_redirect off;

    # Docker's embedded DNS, resolved per request so the gateway starts before the services.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Status page: renders the history kept by status-monitor (/status-monitor/v1/status).
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
        add_header Cache-Control "no-store";
    }

    location / {
        return 404;
    }

    location = /fleet {
        return 301 /fleet/;
    }

    # ^~ so the service regexes below are not tried. Streamlit runs with baseUrlPath=fleet,
    # so the path is forwarded unchanged.
    location ^~ /fleet/ {
        set $fleet_console fleet-console;
        proxy_pass http://$fleet_console:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_buffering off;
    }

    location ~ ^/(vehicle-master|telematics-unit-master|fleet-master|maintenance-history|service-provider-master|vehicle-context-facade|telematics-event|digital-twin-context|policy-playbook|incident-search|risk-scoring|case-management|notification|approval|audit-observability|signal-correlation|status-monitor)$ {
        return 301 /$1/docs;
    }

    location ~ ^/(vehicle-master|telematics-unit-master|fleet-master|maintenance-history|service-provider-master|vehicle-context-facade|telematics-event|digital-twin-context|policy-playbook|incident-search|risk-scoring|case-management|notification|approval|audit-observability|signal-correlation|status-monitor)/ {
        set $service $1;
        proxy_pass http://$service:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Prefix /$service;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        gzip on;
        gzip_types application/json;
    }
}
