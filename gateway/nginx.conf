# Local gateway: http://127.0.0.1:8080/<service>/... -> http://<service>:8080/<service>/...
# The path is forwarded unchanged; X-Forwarded-Prefix lets each FastAPI app serve /docs under it.
server {
    listen 8080;
    absolute_redirect off;

    # Docker's embedded DNS, resolved per request so the gateway starts before the services.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Status page: polls each service's health endpoints through this gateway.
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
        add_header Cache-Control "no-store";
    }

    location / {
        return 404;
    }

    location ~ ^/(vehicle-master|telematics-unit-master|fleet-master|maintenance-history|service-provider-master|vehicle-context-facade|telematics-event|digital-twin-context|policy-playbook|incident-search|risk-scoring|case-management|notification|approval|audit-observability)$ {
        return 301 /$1/docs;
    }

    location ~ ^/(vehicle-master|telematics-unit-master|fleet-master|maintenance-history|service-provider-master|vehicle-context-facade|telematics-event|digital-twin-context|policy-playbook|incident-search|risk-scoring|case-management|notification|approval|audit-observability)/ {
        set $service $1;
        proxy_pass http://$service:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Prefix /$service;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
