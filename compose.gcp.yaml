# Send exports to BigQuery instead of ./.cloud-export:
#
#   gcloud auth application-default login
#   bq mk --location=US --dataset <your project>:fleetops
#   $env:FLEETOPS_GCP_PROJECT = "<your project>"
#   docker compose -f compose.yaml -f compose.gcp.yaml up -d --build cloud-exporter
#
# The exporter creates its tables and *_latest views in the dataset on first load (see
# AGENTIC.md, section 6.1). It uses your Application Default Credentials, mounted read-only;
# FLEETOPS_GCLOUD_ADC defaults to where gcloud writes them on Windows.
#
# Nothing is published to Pub/Sub until FLEETOPS_EXPORT_INCIDENT_TOPIC names a topic; that is
# for the cloud agent, which comes later.

services:
  cloud-exporter:
    environment:
      FLEETOPS_EXPORT_SINK: gcp
      FLEETOPS_GCP_PROJECT: ${FLEETOPS_GCP_PROJECT:?FLEETOPS_GCP_PROJECT is required}
      FLEETOPS_BIGQUERY_DATASET: ${FLEETOPS_BIGQUERY_DATASET:-fleetops}
      FLEETOPS_BIGQUERY_LOCATION: ${FLEETOPS_BIGQUERY_LOCATION:-US}
      FLEETOPS_EXPORT_INCIDENT_TOPIC: ${FLEETOPS_EXPORT_INCIDENT_TOPIC:-}
      GOOGLE_APPLICATION_CREDENTIALS: /gcloud/adc.json
      GOOGLE_CLOUD_PROJECT: ${FLEETOPS_GCP_PROJECT}
    volumes:
      - ${FLEETOPS_GCLOUD_ADC:-${APPDATA}/gcloud/application_default_credentials.json}:/gcloud/adc.json:ro
